# Server Configuration (Google Cloud Run binds to $PORT dynamically, default 8080)
server.port=${PORT:${SERVER_PORT:8080}}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Application configuration
spring.application.name=queueless-backend

# DataSource Configuration:
# In Production (Cloud Run + Supabase): Set SPRING_DATASOURCE_URL to the Supabase Session Pooler URL
# e.g., jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require
# Standalone local dev defaults to embedded H2 running in PostgreSQL-compatible mode.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/queueless;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Hikari Connection Pool (Conservative configuration tuned for Cloud Run autoscaling with Supabase free-tier connection limits)
# With max 3 Cloud Run instances, 3 * 5 = 15 max connections, safely within Supabase pooler quota.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.keepalive-time=60000

# Flyway Versioned Database Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# JPA / Hibernate Configuration
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Actuator Health Check & Monitoring (Cloud Run probes)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Realtime SSE & Async Request Timeouts (3600 seconds matching Cloud Run max request timeout)
spring.mvc.async.request-timeout=3600000
server.tomcat.connection-timeout=3600000

# H2 Console for local debugging if needed
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# Security & JWT configuration
app.jwt.secret=${APP_JWT_SECRET:queueless-ultra-secure-jwt-secret-key-for-digital-token-management-2026-32bytes!}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:2592000000}

# Web Push VAPID configuration
app.webpush.vapid.public-key=${APP_WEBPUSH_VAPID_PUBLIC_KEY:}
app.webpush.vapid.private-key=${APP_WEBPUSH_VAPID_PRIVATE_KEY:}
app.webpush.vapid.subject=${APP_WEBPUSH_VAPID_SUBJECT:mailto:support@queueless.in}

# Platform Admin Key for minimal subscription & UPI config
app.admin.key=${APP_ADMIN_KEY:admin-secret-queueless-2026}

# SMS OTP Gateway Configuration (Production defaults to 'none' requiring real gateway setup; no fake OTP accepted)
app.sms.provider=${APP_SMS_PROVIDER:none}
app.sms.api-key=${APP_SMS_API_KEY:}
app.sms.sender-id=${APP_SMS_SENDER_ID:QUELES}
app.sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.sms.twilio.from-phone=${TWILIO_FROM_PHONE:}
app.sms.fast2sms.api-key=${FAST2SMS_API_KEY:}
app.sms.webhook-url=${APP_SMS_WEBHOOK_URL:}

# OTP Security & Lifecycle Constraints
app.otp.expiry-minutes=${APP_OTP_EXPIRY_MINUTES:5}
app.otp.cooldown-seconds=${APP_OTP_COOLDOWN_SECONDS:60}
app.otp.max-attempts=${APP_OTP_MAX_ATTEMPTS:5}

# Production CORS Allowed Origins (Restricted; no open wildcard with credentials)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://queueless.theabhisheksunny.workers.dev,https://*.workers.dev,http://localhost:*,http://127.0.0.1:*}

# Logging
logging.level.com.queueless=INFO
