# ===================================================================
# QueueLess - Local Development Profile (local)
# Active by default when launching locally without explicit profiles.
# ===================================================================

# Automatically update schema for seamless iterative development
spring.jpa.hibernate.ddl-auto=update

# Enable H2 Web Console for convenient local database inspection at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Logging configuration
logging.level.com.queueless=DEBUG
logging.level.org.hibernate.SQL=WARN

# Local environment isolation type (strictly permitted only under local/test profiles)
app.datasource.isolation-check.expected-environment-type=LOCAL
app.datasource.expected-environment-type=LOCAL
