server.port=8080

# Application configuration
spring.application.name=queueless-backend

# Embedded PostgreSQL-compatible persistent storage (zero external dependency, persists across restarts)
spring.datasource.url=jdbc:h2:file:./data/queueless;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000

# JPA / Hibernate Configuration
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Console for local debugging if needed
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Security & JWT configuration
app.jwt.secret=queueless-ultra-secure-jwt-secret-key-for-digital-token-management-2026-32bytes!
app.jwt.expiration-ms=2592000000

# Platform Admin Key for minimal subscription & UPI config
app.admin.key=admin-secret-queueless-2026

# Logging
logging.level.com.queueless=INFO
