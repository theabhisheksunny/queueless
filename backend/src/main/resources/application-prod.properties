# ===================================================================
# QueueLess - Production Environment Configuration (prod)
# Active when launching production containers (SPRING_PROFILES_ACTIVE=prod)
# ===================================================================

# Production Cloud Run dynamically binds to PORT
server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Production DataSource (Supabase Session Pooler)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/queueless_prod}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:queueless_app_prod}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# DataSource Isolation Verification for Production (Strict pre-migration gate)
# Base fails closed. Production profile explicitly mandates PRODUCTION environment.
app.datasource.isolation-check.enabled=true
app.datasource.isolation-check.expected-environment-type=PRODUCTION
app.datasource.expected-environment-type=PRODUCTION
app.datasource.isolation-check.expected-project-ref=${QUEUELESS_PROD_SUPABASE_PROJECT_REF:${APP_DATASOURCE_EXPECTED_PROJECT_REF:}}
app.datasource.expected-project-ref=${app.datasource.isolation-check.expected-project-ref}
app.datasource.isolation-check.prohibited-project-refs=${QUEUELESS_STAGING_SUPABASE_PROJECT_REF:${APP_DATASOURCE_PROHIBITED_PROJECT_REFS:}}
app.datasource.prohibited-project-refs=${app.datasource.isolation-check.prohibited-project-refs}

# HikariCP Pool (Conservative for Cloud Run autoscaling with Supabase limits)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.data-source-properties.connectTimeout=5
spring.datasource.hikari.data-source-properties.socketTimeout=5

# Flyway Migrations (Controlled migration identity; distinct from runtime)
# Fails closed at startup if dedicated migration credentials are not supplied
spring.flyway.enabled=true
spring.flyway.user=${SPRING_FLYWAY_USER}
spring.flyway.password=${SPRING_FLYWAY_PASSWORD}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JPA / Hibernate Configuration
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false

# Actuator Health & Probes for Cloud Run Production
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,dbReadiness,db
management.endpoint.health.group.readiness.show-details=never

# Security & Secrets (Strict environment variable substitution)
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:2592000000}
app.admin.key=${APP_ADMIN_KEY}

# Production Super Admin Bootstrap (Default disabled in production; manual bootstrap only)
app.superadmin.bootstrap.enabled=${APP_SUPERADMIN_BOOTSTRAP_ENABLED:false}

# CORS Configuration for Production Frontend
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://queueless.theabhisheksunny.workers.dev}

# Logging & Monitoring
logging.level.com.queueless=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
logging.pattern.console=%d{ISO8601} [%thread] %-5level %logger{36} - %msg%n
