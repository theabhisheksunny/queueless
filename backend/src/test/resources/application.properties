spring.application.name=queueless-backend-test

# In-memory H2 database for ultra-fast, isolated automated testing
spring.datasource.url=jdbc:h2:mem:queueless_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.datasource.hikari.maximum-pool-size=25
spring.datasource.hikari.connection-timeout=10000

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

app.jwt.secret=queueless-ultra-secure-jwt-secret-key-for-digital-token-management-2026-32bytes!
app.jwt.expiration-ms=2592000000
app.admin.key=admin-secret-queueless-2026
